[workspace]
resolver = "2"
members = ["magic_map", "magic_map_macros", "leaf_provider"]
# `compat/*` are standalone feature-configuration guards built directly in CI,
# kept out of the workspace so feature unification doesn't enable `validate` on
# them (which would defeat their purpose).
exclude = ["compat"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rsansores/magic_map"
authors = ["Ricardo Sansores <ricardo@ssf.mx>"]
