name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build -p magic_map --no-default-features
      # Gating guard: `validator` users who don't enable `magic_map/validate`
      # must still compile (no `.validate()` call is generated).
      - run: cargo build --manifest-path compat/no-validate-feature/Cargo.toml
      - run: cargo build --manifest-path compat/scope-downstream/Cargo.toml
